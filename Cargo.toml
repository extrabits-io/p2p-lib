[package]
name = "p2p-lib"
version = "0.1.0"
authors = ["Eric Zhang <ekzhang1@gmail.com>", "Jamin Menter <jaminmenter@outlook.com>"]
license = "MIT"
description = "A modern, simple TCP tunnel in Rust that exposes local ports to a remote server, bypassing standard NAT connection firewalls."
repository = "https://github.com/extrabits-io/p2p-lib"
keywords = ["network", "cli", "tunnel", "tcp"]
categories = ["network-programming", "web-programming"]
readme = "README.md"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.0.22", features = ["derive", "env"] }
dashmap = "5.2.0"
ed25519-dalek = { workspace = true }
fastrand = "1.9.0"
futures-util = { version = "0.3.21", features = ["sink"] }
hex = "0.4.3"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "macros", "net", "time"] }
tokio-util = { version = "0.7.1", features = ["codec"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
lazy_static = "1.4.0"
rstest = "0.15.0"
tokio = { workspace = true, features = ["sync"] }
